[project]
name = "crypto-market-analysis"
version = "0.5.0"
description = "Public-data BTC/ETH market analysis tools, CLI and MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.5,<5",
  "httpx[socks]>=0.28,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.9,<4",
  "mcp>=1.15,<2",
  "pyarrow>=18,<24",
  "duckdb>=1.2,<2",
  "requests[socks]>=2.32,<3",
  "pyjwt[crypto]>=2.10,<3",
  "anyio>=4.15.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
crypto-market-analysis = "crypto_market_analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
